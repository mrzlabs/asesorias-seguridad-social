name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Sin npm ci: la suite no tiene dependencias, usa solo modulos nativos.
      - name: Validaciones de SEO tecnico
        run: npm test
